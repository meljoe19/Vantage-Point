
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantage Point Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #f8fafc;
    }
    .leaflet-container {
      background: #e2e8f0 !important;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @keyframes marker-pulse {
      0% { transform: scale(1.4); filter: drop-shadow(0 0 0px rgba(249, 168, 37, 0.7)); }
      50% { transform: scale(1.6); filter: drop-shadow(0 0 15px rgba(249, 168, 37, 0.9)); }
      100% { transform: scale(1.4); filter: drop-shadow(0 0 0px rgba(249, 168, 37, 0.7)); }
    }
    .selected-marker-pulse {
      animation: marker-pulse 2s infinite ease-in-out;
    }
  </style>
<script type="importmap">

}
</script>
